name: Build Flutter APK

on:
  workflow_dispatch: # Permite disparar manualmente com 1 clique no GitHub
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Ensure google-services.json exists
        run: |
          if [ ! -f mobile/android/app/google-services.json ]; then
            echo '{"project_info":{"project_number":"123456789012","project_id":"tatichatbot-491215","storage_bucket":"tatichatbot-491215.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:abcdef0123456789","android_client_info":{"package_name":"com.tati.ai"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuild123456789"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > mobile/android/app/google-services.json
          fi

      - name: Build Android Release APK
        working-directory: mobile
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tati-ai-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

