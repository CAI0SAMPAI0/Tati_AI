name: Continuous Deployment (VPS)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Auto Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            cd /home/deploy/Tati_AI
            echo ">>> [GitHub Actions] Baixando commits recentes da main..."
            git pull origin main
            
            echo ">>> [GitHub Actions] Executando atualizacao dos servicos..."
            bash scripts/deploy_vps_autocommit.sh
