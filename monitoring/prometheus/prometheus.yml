global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "traefik"
    static_configs:
      - targets: ["tati_ai_traefik:8082"]

  - job_name: "node_exporter"
    dns_sd_configs:
      - names: ["tasks.tati_monitoring_node_exporter"]
        type: "A"
        port: 9100

  - job_name: "cadvisor"
    dns_sd_configs:
      - names: ["tasks.tati_monitoring_cadvisor"]
        type: "A"
        port: 8080

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres_exporter:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis_exporter:9121"]
