version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tati_ai_backend
    restart: unless-stopped
    command:
      [
        "uvicorn",
        "app.asgi:application",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app",
      ]
    env_file:
      - .env
    environment:
      - PORT=8000
      - DJANGO_SETTINGS_MODULE=app.settings.development
      - DEBUG=True
      - PYTHONDONTWRITEBYTECODE=1
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app:delegated 
      - ./backend/media:/app/media
      - /app/.pytest_cache
      - /app/__pycache__
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_WS_BASE_URL: ws://localhost:8000
    container_name: tati_ai_frontend
    restart: unless-stopped
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PORT=3000
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_WS_BASE_URL=ws://localhost:8000
      - NODE_ENV=development
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app:delegated
      - /app/node_modules
      - /app/.vite

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tati_ai_celery_worker
    restart: unless-stopped
    command:
      [
        "watchfiles",
        "--filter",
        "python",
        "celery -A app worker -l info --concurrency=1",
        "/app",
      ]
    healthcheck:
      disable: true
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=app.settings.development
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tati_ai_celery_beat
    restart: unless-stopped
    command: ["celery", "-A", "app", "beat", "-l", "info"]
    healthcheck:
      disable: true
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=app.settings.development
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy

