services:
  # ─── Backend (FastAPI) ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─── Frontend Tati AI (Next.js) ────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:8080"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ─── Hub Site (Next.js) ────────────────────────────────────────────────────
  hub:
    build:
      context: .
      dockerfile: apps/hub-site/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:8080"
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
