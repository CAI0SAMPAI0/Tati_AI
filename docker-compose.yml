version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tati_ai_backend
    restart: unless-stopped
    command:
      [
        "uvicorn",
        "app.asgi:application",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app",
      ]
    env_file:
      - .env
    environment:
      - PORT=8000
      - DJANGO_SETTINGS_MODULE=app.settings.development
      - DEBUG=True
      - WATCHFILES_FORCE_POLLING=true
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    container_name: tati_ai_frontend
    restart: unless-stopped
    command: ["sh", "-c", "rm -rf /app/.next/* && npx next dev -H 0.0.0.0 -p 3000"]
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tati_ai_celery_worker
    restart: unless-stopped
    command:
      [
        "watchfiles",
        "--filter",
        "python",
        "celery -A app worker -l info --concurrency=2",
        "/app",
      ]
    healthcheck:
      disable: true
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=app.settings.development
      - WATCHFILES_FORCE_POLLING=true
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tati_ai_celery_beat
    restart: unless-stopped
    command: ["celery", "-A", "app", "beat", "-l", "info"]
    healthcheck:
      disable: true
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=app.settings.development
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
