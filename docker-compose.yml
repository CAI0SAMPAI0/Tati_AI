version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: tati_ai_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       POSTGRES_USER:       POSTGRES_PASSWORD:     ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tati_ai_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tati_ai_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://\:\@db:5432/      REDIS_URL: redis://redis:6379/0
      PORT: 8080
      DJANGO_SETTINGS_MODULE: app.settings.production
    ports:
      - '8080:8080'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tati_ai_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - '3000:3000'

volumes:
  postgres_data:
