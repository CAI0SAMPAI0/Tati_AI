version: "3.9"

services:
  traefik:
    image: traefik:v3.6
    command:
      # API / Dashboard
      - "--api.dashboard=true"
      - "--api.insecure=false"

      # Docker Swarm provider
      - "--providers.swarm=true"
      - "--providers.swarm.endpoint=unix:///var/run/docker.sock"
      - "--providers.swarm.exposedByDefault=false"
      - "--providers.swarm.network=traefik_public"

      # Entrypoints HTTP / HTTPS / Metricas internas (Prometheus)
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.metrics.address=:8082"

      # Metricas Prometheus (acessiveis apenas na rede interna Docker, sem porta publica)
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entryPoint=metrics"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addRoutersLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"

      # Let's Encrypt via HTTP-01 (direto no dominio da VPS sem exigir Cloudflare)
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@tati.ai}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"

      # Logs
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--accesslog.format=json"
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
    volumes:
      - tati_ai_letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik_public
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        window: 120s
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN}`)"
        - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
        - "traefik.http.routers.traefik-dashboard.tls=true"
        - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
        - "traefik.http.routers.traefik-dashboard.service=api@internal"
        - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth"
        - "traefik.http.middlewares.traefik-auth.basicauth.users=admin:$$2b$$12$$ejsA6pdJNsljVJT2BhdJAeQtVZ4P9p.25bIJQFMPgN4ngQ26s6cTO"
        - "traefik.http.services.traefik.loadbalancer.server.port=8080"

  app:
    image: ghcr.io/cai0sampai0/tati_ai:${APP_IMAGE_TAG:-latest}
    command: >
      gunicorn app.asgi:application
      --bind 0.0.0.0:8000
      --workers 1
      --worker-class uvicorn.workers.UvicornWorker
      --timeout 120
      --graceful-timeout 30
      --keep-alive 5
      --forwarded-allow-ips '*'
      --access-logfile -
      --error-logfile -
    env_file: .env
    environment:
      ENVIRONMENT: "production"
      DJANGO_SETTINGS_MODULE: "app.settings.production"
      DEBUG: "False"
      ENABLE_DEBUG_TOOLBAR: "false"
      SERVERLESS: "false"
      ENABLE_NOTIFICATION_SCHEDULER: "false"
      USE_REDIS_CHANNELS: "true"
      USE_LOCAL_DB: "true"
      DB_CONN_MAX_AGE: "0"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:-tati_ai}"
      POSTGRES_USER: "${POSTGRES_USER:-tati_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      WAHA_API_URL: "http://waha:3000"
      FORWARD_WEBHOOK_URL: ""
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-https://tati-ai.vercel.app/auth/google/callback}"
      API_URL: "https://${DOMAIN}"
    volumes:
      - tati_ai_media_data:/app/media
      - tati_ai_static_data:/app/staticfiles
    networks:
      - traefik_public
      - tati_ai_internal
      - tati_ai_egress
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 15s
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 10s
        window: 120s
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.tati-api.rule=Host(`${DOMAIN}`)"
        - "traefik.http.routers.tati-api.entrypoints=websecure"
        - "traefik.http.routers.tati-api.tls=true"
        - "traefik.http.routers.tati-api.tls.certresolver=letsencrypt"
        - "traefik.http.routers.tati-api.middlewares=tati-retry"
        - "traefik.http.middlewares.tati-retry.retry.attempts=2"
        - "traefik.http.middlewares.tati-retry.retry.initialinterval=100ms"
        - "traefik.http.services.tati-api.loadbalancer.server.port=8000"
        - "traefik.http.services.tati-api.loadbalancer.healthcheck.path=/health"
        - "traefik.http.services.tati-api.loadbalancer.healthcheck.interval=15s"
        - "traefik.http.services.tati-api.loadbalancer.healthcheck.hostname=${DOMAIN}"
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
        reservations:
          cpus: "0.25"
          memory: 384M

  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-tati_ai}"
      POSTGRES_USER: "${POSTGRES_USER:-tati_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - tati_ai_pg_data:/var/lib/postgresql
    networks:
      - tati_ai_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-tati_user} -d $${POSTGRES_DB:-tati_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 120s
      resources:
        limits:
          cpus: "1.0"
          memory: 1280M
        reservations:
          cpus: "0.25"
          memory: 256M

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 384mb --maxmemory-policy allkeys-lru
    volumes:
      - tati_ai_redis_data:/data
    networks:
      - tati_ai_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 120s
      resources:
        limits:
          cpus: "0.3"
          memory: 448M
        reservations:
          cpus: "0.1"
          memory: 64M

  celery_worker:
    image: ghcr.io/cai0sampai0/tati_ai:${APP_IMAGE_TAG:-latest}
    entrypoint: ["/app/worker-entrypoint.sh"]
    command: celery -A app worker -l info --concurrency=2
    env_file: .env
    environment:
      ENVIRONMENT: "production"
      DJANGO_SETTINGS_MODULE: "app.settings.production"
      DEBUG: "False"
      ENABLE_DEBUG_TOOLBAR: "false"
      SERVERLESS: "false"
      ENABLE_NOTIFICATION_SCHEDULER: "false"
      USE_LOCAL_DB: "true"
      DB_CONN_MAX_AGE: "0"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:-tati_ai}"
      POSTGRES_USER: "${POSTGRES_USER:-tati_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      WAHA_API_URL: "http://waha:3000"
      FORWARD_WEBHOOK_URL: ""
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-https://tati-ai.vercel.app/auth/google/callback}"
      API_URL: "https://${DOMAIN}"
    volumes:
      - tati_ai_media_data:/app/media
    networks:
      - tati_ai_internal
      - tati_ai_egress
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 20s
      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 10s
        window: 120s
      resources:
        limits:
          cpus: "1.0"
          memory: 1280M
        reservations:
          cpus: "0.2"
          memory: 256M

  celery_beat:
    image: ghcr.io/cai0sampai0/tati_ai:${APP_IMAGE_TAG:-latest}
    entrypoint: ["/app/worker-entrypoint.sh"]
    command: celery -A app beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      ENVIRONMENT: "production"
      DJANGO_SETTINGS_MODULE: "app.settings.production"
      DEBUG: "False"
      ENABLE_DEBUG_TOOLBAR: "false"
      SERVERLESS: "false"
      ENABLE_NOTIFICATION_SCHEDULER: "false"
      USE_LOCAL_DB: "true"
      DB_CONN_MAX_AGE: "0"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:-tati_ai}"
      POSTGRES_USER: "${POSTGRES_USER:-tati_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      WAHA_API_URL: "http://waha:3000"
    networks:
      - tati_ai_internal
      - tati_ai_egress
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 5s
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 10s
        window: 120s
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 96M

  waha:
    image: devlikeapro/waha:noweb
    env_file: .env
    environment:
      PORT: "3000"
      WHATSAPP_DEFAULT_ENGINE: "NOWEB"
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
      WAHA_PRINT_QR: "false"
    volumes:
      - tati_ai_waha_sessions:/app/.sessions
    networks:
      - tati_ai_internal
      - tati_ai_egress
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        window: 120s
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 96M

networks:
  traefik_public:
    external: true
  tati_ai_internal:
    external: true
  tati_ai_egress:
    external: true

volumes:
  tati_ai_pg_data:
    external: true
  tati_ai_media_data:
    external: true
  tati_ai_static_data:
    external: true
  tati_ai_letsencrypt:
    external: true
  tati_ai_redis_data:
    external: true
  tati_ai_waha_sessions:
    external: true
