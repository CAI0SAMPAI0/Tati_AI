version: "3.9"

services:
  prometheus:
    image: prom/prometheus:v3.2.1
    user: "0"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - tati_ai_prometheus_data:/prometheus
    networks:
      - tati_monitoring_net
      - traefik_public
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.05"
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.prometheus.rule=Host(`prometheus.${DOMAIN}`)"
        - "traefik.http.routers.prometheus.entrypoints=websecure"
        - "traefik.http.routers.prometheus.tls=true"
        - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
        - "traefik.http.routers.prometheus.middlewares=prom-auth"
        - "traefik.http.middlewares.prom-auth.basicauth.users=admin:$$2b$$12$$ejsA6pdJNsljVJT2BhdJAeQtVZ4P9p.25bIJQFMPgN4ngQ26s6cTO"
        - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  node_exporter:
    image: prom/node-exporter:v1.9.0
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - tati_monitoring_net
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.2"
          memory: 96M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    command:
      - "-docker_only=true"
      - "-housekeeping_interval=15s"
      - "-disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - tati_monitoring_net
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.3"
          memory: 192M

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_URI: "tati_ai_db:5432/${POSTGRES_DB:-tati_ai}?sslmode=disable"
      DATA_SOURCE_USER: "${POSTGRES_USER:-tati_user}"
      DATA_SOURCE_PASS: "${POSTGRES_PASSWORD}"
    networks:
      - tati_monitoring_net
      - tati_ai_internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.2"
          memory: 96M

  redis_exporter:
    image: oliver006/redis_exporter:v1.67.0-alpine
    environment:
      REDIS_ADDR: "redis://tati_ai_redis:6379"
    networks:
      - tati_monitoring_net
      - tati_ai_internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.15"
          memory: 64M

  loki:
    image: grafana/loki:3.4.2
    user: "0"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - tati_ai_loki_data:/loki
    networks:
      - tati_monitoring_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.4"
          memory: 256M

  promtail:
    image: grafana/promtail:3.4.2
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - tati_monitoring_net
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  grafana:
    image: grafana/grafana:11.5.2
    user: "0"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_ROOT_URL: "https://grafana.${DOMAIN}"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/tati-ai-overview.json"
    volumes:
      - tati_ai_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - traefik_public
      - tati_monitoring_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.tati-grafana.rule=Host(`grafana.${DOMAIN}`)"
        - "traefik.http.routers.tati-grafana.entrypoints=websecure"
        - "traefik.http.routers.tati-grafana.tls=true"
        - "traefik.http.routers.tati-grafana.tls.certresolver=letsencrypt"
        - "traefik.http.services.tati-grafana.loadbalancer.server.port=3000"
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 96M

networks:
  traefik_public:
    external: true
  tati_ai_internal:
    external: true
  tati_monitoring_net:
    external: true

volumes:
  tati_ai_prometheus_data:
    external: true
  tati_ai_grafana_data:
    external: true
  tati_ai_loki_data:
    external: true
