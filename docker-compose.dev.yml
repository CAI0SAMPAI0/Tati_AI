# ─── docker-compose.dev.yml ────────────────────────────────────────────────────
# Ambiente de DESENVOLVIMENTO local — com hot-reload em todos os serviços.
#
# Uso rápido:
#   docker compose -f docker-compose.dev.yml up --build
#
# Serviços individuais:
#   docker compose -f docker-compose.dev.yml up backend
#   docker compose -f docker-compose.dev.yml up frontend
#   docker compose -f docker-compose.dev.yml up hub
# ────────────────────────────────────────────────────────────────────────────────

services:

  # ─── Backend (FastAPI + uvicorn --reload) ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8001:8001"
    volumes:
      # Monta o código-fonte diretamente — qualquer mudança reinicia o uvicorn
      - ./backend:/app
    env_file:
      - .env          # variáveis de produção/segredos reais
    environment:
      PORT: "8001"
      PYTHONUNBUFFERED: "1"
      WEB_CONCURRENCY: "1"
      # Forçamos a usar o redis local do docker em dev
      UPSTASH_REDIS_URL: "redis://redis"
      UPSTASH_REDIS_TOKEN: ""
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── Redis (Para o Celery no ambiente local) ────────────────────────────────
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Celery Worker (Processamento em Background) ───────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      # Forçamos a usar o redis local do docker se estiver rodando via compose
      UPSTASH_REDIS_URL: "redis://redis"
      UPSTASH_REDIS_TOKEN: ""
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "--without-gossip", "--without-mingle", "--without-heartbeat"]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Celery Beat (Agendador de Tarefas) ────────────────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      # Forçamos a usar o redis local do docker se estiver rodando via compose
      UPSTASH_REDIS_URL: "redis://redis"
      UPSTASH_REDIS_TOKEN: ""
    command: ["celery", "-A", "app.core.celery_app", "beat", "--loglevel=info"]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped


